<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal portfolio website showcasing my mission, vision, skills, and projects.">
  <meta name="author" content="Nelson">
  <meta property="og:title" content="Nelson | Portfolio">
  <meta property="og:description" content="Software engineer building meaningful digital experiences. Mission, vision, skills, and projects.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4QBY">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:creator" content="@nelson">
  <title>Nelson | Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%233b82f6'/%3E%3Ctext x='50' y='65' font-family='sans-serif' font-size='50' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%233b82f6'/%3E%3Ctext x='50' y='65' font-family='sans-serif' font-size='50' fill='%23ffffff' text-anchor='middle' font-weight='bold'%3EN%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f8fafc;
      --bg-tertiary: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --border: #e2e8f0;
      --card: #ffffff;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --radius: 16px;
      --radius-lg: 24px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Poppins', sans-serif;
    }

    [data-theme="dark"] {
      --bg-primary: #020617;
      --bg-secondary: #0f172a;
      --bg-tertiary: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --accent: #60a5fa;
      --accent-hover: #3b82f6;
      --accent-glow: rgba(96, 165, 250, 0.2);
      --border: #334155;
      --card: #1e293b;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      transition: background 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-display);
      font-weight: 700;
      line-height: 1.2;
      color: var(--text-primary);
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: var(--transition);
    }

    a:hover {
      color: var(--accent-hover);
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Theme Toggle */
    .theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      width: 50px;
      height: 50px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: var(--text-primary);
      z-index: 1000;
      transition: var(--transition);
      box-shadow: var(--shadow);
    }

    .theme-toggle:hover {
      transform: rotate(15deg);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Navigation */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 999;
      transition: var(--transition);
    }

    [data-theme="dark"] nav {
      background: rgba(2, 6, 23, 0.85);
    }

    .nav-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo span {
      color: var(--accent);
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 0.95rem;
      position: relative;
      transition: var(--transition);
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
      transition: var(--transition);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      color: var(--text-primary);
      cursor: pointer;
      font-size: 1.5rem;
    }

    .mobile-menu {
      display: none;
      position: absolute;
      top: 70px;
      left: 0;
      width: 100%;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem;
      flex-direction: column;
      gap: 1rem;
    }

    .mobile-menu.active {
      display: flex;
    }

    .mobile-menu a {
      color: var(--text-primary);
      font-weight: 600;
      font-size: 1rem;
    }

    /* Hero Section */
    .hero {
      padding: 120px 0 80px;
      min-height: 85vh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, var(--accent-glow), transparent 70%);
      z-index: 0;
      opacity: 0.5;
    }

    .hero .container {
      position: relative;
      z-index: 1;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .hero-content h1 {
      font-size: 3.5rem;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }

    .hero-content h1 .highlight {
      color: var(--accent);
    }

    .hero-subtitle {
      font-size: 1.25rem;
      color: var(--text-secondary);
      margin-bottom: 2rem;
      max-width: 500px;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      animation: heroBtnFade 1.2s ease forwards;
    }

    .hero-actions .btn {
      animation: heroBtnPop 0.6s ease both;
      animation-fill-mode: both;
    }

    .hero-actions .btn:nth-child(1) { animation-delay: 0.1s; }
    .hero-actions .btn:nth-child(2) { animation-delay: 0.2s; }
    .hero-actions .btn:nth-child(3) { animation-delay: 0.3s; }
    .hero-actions .btn:nth-child(4) { animation-delay: 0.4s; }

    @keyframes heroBtnFade {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes heroBtnPop {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .btn {
      padding: 1rem 2rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
      border: none;
      display: inline-block;
      text-align: center;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .btn-outline {
      background: transparent;
      color: var(--text-primary);
      border: 2px solid var(--border);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .hero-visual {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .profile-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-lg);
      max-width: 380px;
      position: relative;
      overflow: hidden;
      animation: float 6s ease-in-out infinite;
    }

    .profile-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), #8b5cf6);
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 3rem;
      font-weight: 800;
      box-shadow: 0 8px 24px var(--accent-glow);
      border: 4px solid var(--card);
    }

    .profile-name {
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .profile-title {
      text-align: center;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }

    .profile-bio {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .profile-stats {
      display: flex;
      justify-content: space-around;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Section Headers */
    .section-header {
      text-align: center;
      margin-bottom: 4rem;
    }

    .section-header h2 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .section-header p {
      color: var(--text-secondary);
      font-size: 1.1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .section-divider {
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), #8b5cf6);
      margin: 0 auto 1.5rem;
      border-radius: 2px;
    }

    /* General Sections */
    section {
      padding: 80px 0;
    }

    /* About Section */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: start;
    }

    .about-text h3 {
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
    }

    .about-text p {
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      font-size: 1.05rem;
    }

    .about-features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .feature-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 1rem;
      background: var(--bg-secondary);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .feature-icon {
      width: 32px;
      height: 32px;
      background: var(--accent-glow);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 1rem;
      flex-shrink: 0;
    }

    .feature-text {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .about-image {
      position: relative;
    }

    .about-image img {
      max-width: 300px;
      width: 100%;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      display: block;
      margin: 0 auto;
    }

    .image-badge {
      position: absolute;
      bottom: -20px;
      left: -20px;
      background: var(--accent);
      color: #fff;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Mission & Vision */
    .mission-vision-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .mv-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }

    .mv-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
      border-color: var(--accent);
    }

    .mv-card h3 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .mv-icon {
      font-size: 1.75rem;
    }

    .mv-card p {
      color: var(--text-secondary);
      line-height: 1.7;
    }

    .mv-divider {
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
    }

    .mv-meta {
      display: flex;
      gap: 1rem;
      margin-top: auto;
    }

    .mv-badge {
      padding: 0.4rem 0.8rem;
      background: var(--bg-tertiary);
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    /* Values Section */
    .values-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
    }

    .value-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      transition: var(--transition);
      text-align: center;
    }

    .value-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }

    .value-icon {
      width: 64px;
      height: 64px;
      background: var(--accent-glow);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 1.5rem;
      color: var(--accent);
    }

    .value-card h3 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
    }

    .value-card p {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    /* Skills Section */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .skill-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      transition: var(--transition);
    }

    .skill-item:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
    }

    .skill-name {
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .skill-bar {
      height: 6px;
      background: var(--bg-tertiary);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 0.75rem;
    }

    .skill-progress {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #8b5cf6);
      border-radius: 3px;
      width: 0;
      transition: width 1s ease;
    }

    /* Projects Section */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
    }

    .project-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }

    .project-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
      border-color: var(--accent);
    }

    .project-image {
      height: 200px;
      background: linear-gradient(135deg, var(--bg-tertiary), var(--bg-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 2.5rem;
      position: relative;
      overflow: hidden;
    }

    .project-image:hover::after {
      content: 'View Details';
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 600;
      backdrop-filter: blur(4px);
      transition: var(--transition);
    }

    .project-content {
      padding: 1.5rem;
    }

    .project-tags {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .project-tag {
      padding: 0.25rem 0.75rem;
      background: var(--bg-tertiary);
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .project-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }

    .project-desc {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .project-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    .project-link {
      color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .project-link:hover {
      color: var(--accent-hover);
    }

    /* Excel Section */
    .excel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: start;
    }

    .excel-info h3 {
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }

    .excel-info p {
      color: var(--text-secondary);
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }

    .excel-table-wrap {
      overflow-x: auto;
    }

    .excel-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .excel-table th,
    .excel-table td {
      padding: 1rem 1.25rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .excel-table th {
      background: var(--bg-tertiary);
      font-weight: 700;
      color: var(--text-primary);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .excel-table tr:last-child td {
      border-bottom: none;
    }

    .excel-table tr:hover td {
      background: var(--bg-secondary);
    }

    .excel-actions {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn-excel {
      background: linear-gradient(90deg, var(--accent), #8b5cf6);
      color: #fff;
    }

    .btn-excel:hover {
      filter: brightness(1.1);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    /* Excel Inline Viewer */
    .excel-viewer {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.55);
      backdrop-filter: blur(6px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    [data-theme="light"] .excel-viewer {
      background: rgba(0, 0, 0, 0.45);
    }

    .excel-viewer-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .excel-viewer-content {
      position: relative;
      z-index: 2;
      width: min(95vw, 1100px);
      max-height: 85vh;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: none;
    }

    .excel-viewer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    .excel-viewer-header h3 {
      font-size: 1.25rem;
      margin: 0;
      color: var(--text-primary);
    }

    .btn-close {
      background: transparent;
      border: none;
      font-size: 1.75rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
      padding: 0 0.5rem;
    }

    .btn-close:hover {
      color: var(--text-primary);
    }

    .excel-viewer-body {
      flex: 1;
      overflow: auto;
      padding: 1rem;
    }

    .excel-scroll {
      overflow: auto;
    }

    .excel-viewer table {
      border-collapse: collapse;
      width: 100%;
      min-width: 600px;
      background: var(--card);
      font-size: 0.85rem;
    }

    .excel-viewer th,
    .excel-viewer td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      text-align: left;
      white-space: nowrap;
    }

    .excel-viewer th {
      background: var(--bg-tertiary);
      font-weight: 700;
      color: var(--text-primary);
      position: sticky;
      top: 0;
    }

    .excel-viewer tr:nth-child(even) td {
      background: var(--bg-secondary);
    }

    /* Contact Section */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
    }

    .contact-info h3 {
      font-size: 1.75rem;
      margin-bottom: 1rem;
    }

    .contact-info p {
      color: var(--text-secondary);
      margin-bottom: 2rem;
      font-size: 1.05rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .contact-icon {
      width: 44px;
      height: 44px;
      background: var(--accent-glow);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 1.25rem;
      flex-shrink: 0;
    }

    .contact-detail h4 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: var(--text-primary);
    }

    .contact-detail span {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .social-links {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .social-link {
      width: 44px;
      height: 44px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      font-size: 1.25rem;
      transition: var(--transition);
    }

    .social-link:hover {
      background: var(--accent);
      color: #fff;
      transform: translateY(-3px);
    }

    .contact-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .contact-actions .btn {
      text-align: center;
    }

    .contact-form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--text-primary);
      font-size: 0.95rem;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.875rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    /* Footer */
    footer {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 40px 0;
      margin-top: 2rem;
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .footer-text {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .footer-text span {
      color: var(--accent);
      font-weight: 700;
    }

    .back-to-top {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 50px;
      height: 50px;
      background: var(--accent);
      color: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition);
      z-index: 900;
      box-shadow: var(--shadow-lg);
    }

    .back-to-top.visible {
      opacity: 1;
      visibility: visible;
    }

    .back-to-top:hover {
      background: var(--accent-hover);
      transform: translateY(-3px);
    }

    /* Animations */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reveal {
      opacity: 0;
      transform: translateY(40px);
      transition: all 0.8s ease;
    }

    .reveal.active {
      opacity: 1;
      transform: translateY(0);
    }

    .typewriter {
      overflow: hidden;
      border-right: 3px solid var(--accent);
      white-space: nowrap;
      animation: typing 3.5s steps(40, end), blink-cursor 0.75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0; }
      to { width: 100%; }
    }

    @keyframes blink-cursor {
      from, to { border-color: transparent; }
      50% { border-color: var(--accent); }
    }

    /* Utility */
    .text-center { text-align: center; }
    .mb-2 { margin-bottom: 2rem; }
    
    /* Responsive */
    @media (max-width: 900px) {
      .hero-grid,
      .about-grid,
      .contact-grid {
        grid-template-columns: 1fr;
      }

      .hero-content h1 {
        font-size: 2.5rem;
      }

      .nav-links {
        display: none;
      }

      .mobile-menu-btn {
        display: block;
      }

      .profile-card {
        max-width: 100%;
      }

      .section-header h2 {
        font-size: 2rem;
      }

      .footer-content {
        flex-direction: column;
        text-align: center;
      }
    }

    @media (max-width: 600px) {
      .hero-content h1 {
        font-size: 2rem;
      }

      .hero-actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
        text-align: center;
      }

      .about-features {
        grid-template-columns: 1fr;
      }

      .mv-card,
      .value-card {
        padding: 1.5rem;
      }

      .back-to-top {
        bottom: 1rem;
        right: 1rem;
      }

      .theme-toggle {
        top: 1rem;
        right: 1rem;
      }
    }

    /* Print stylesheet */
    @media print {
      * { background: transparent !important; color: #000 !important; box-shadow: none !important; text-shadow: none !important; }
      .theme-toggle, .mobile-menu-btn, .mobile-menu, .back-to-top, .btn, .project-link, .social-links, .contact-form, nav, footer { display: none !important; }
      .hero { padding: 0; min-height: auto; }
      .hero-content h1 { font-size: 2rem; }
      section { padding: 0; margin: 0; border: none; box-shadow: none; }
      .container { max-width: 100%; padding: 0; }
      .profile-card, .excel-viewer { display: none !important; }
      .excel-viewer-table { font-size: 8pt; }
      .excel-viewer th, .excel-viewer td { padding: 3px 6px; }
      a { color: #000 !important; text-decoration: underline; }
    }

    /* Trading Platform */
    .trade-modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.7);
      backdrop-filter: blur(8px);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow-y: auto;

    body.trade-mode > *:not(#tradeModal),
    body.trade-mode header,

    body.trade-mode #trade-modal-wrap {
      display: flex !important;
      position: fixed !important;
      inset: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #0b1026 !important;
      backdrop-filter: none !important;
      align-items: stretch !important;
      justify-content: stretch !important;
      z-index: 3000 !important;
      overflow: hidden !important;
    }
    body.trade-mode #tradeModal {
      display: block !important;
      width: 100vw !important;
      height: 100vh !important;
      max-height: none !important;
      border-radius: 0 !important;
      border: none !important;
      background: #0b1026 !important;
      box-shadow: none !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    body.trade-mode .trade-window {
      width: 100vw !important;
      height: 100vh !important;
      max-height: none !important;
      border-radius: 0 !important;
      border: none !important;
      background: #0b1026 !important;
      box-shadow: none !important;
      display: flex !important;
      flex-direction: column !important;
      overflow: hidden !important;

    body.trade-mode .trade-modal-overlay { display: none !important; }

      position: absolute;

    .trade-window {

      flex: 1;

  <script>
    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;
    const savedTheme = localStorage.getItem('theme');

    if (savedTheme) {
      html.setAttribute('data-theme', savedTheme);
      themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
    }

    themeToggle.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      themeToggle.textContent = next === 'dark' ? '☀️' : '🌙';
    });

    // Typewriter effect
    const typewriter = document.getElementById('typewriter');
    const words = ['Software Engineer.', 'Problem Solver.', 'Creator.', 'Builder.'];
    let wordIndex = 0;
    let charIndex = 0;
    let isDeleting = false;

    function type() {
      const currentWord = words[wordIndex];
      if (isDeleting) {
        typewriter.textContent = currentWord.substring(0, charIndex - 1);
        charIndex--;
      } else {
        typewriter.textContent = currentWord.substring(0, charIndex + 1);
        charIndex++;
      }

      if (!isDeleting && charIndex === currentWord.length) {
        isDeleting = true;
        setTimeout(type, 1500);
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        wordIndex = (wordIndex + 1) % words.length;
        setTimeout(type, 500);
      } else {
        setTimeout(type, isDeleting ? 50 : 100);
      }
    }

    setTimeout(type, 1000);

    // Mobile menu
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const navLinks = document.getElementById('navLinks');

    mobileMenuBtn.addEventListener('click', () => {
      mobileMenu.classList.toggle('active');
    });

    document.querySelectorAll('.mobile-menu a').forEach(link => {
      link.addEventListener('click', () => {
        mobileMenu.classList.remove('active');
      });
    });

    // Reveal on scroll
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('active');
        }
      });
    }, observerOptions);

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

    // Skill bars animation
    const skillObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const progress = entry.target.querySelector('.skill-progress');
          if (progress) {
            progress.style.width = progress.dataset.width;
          }
          skillObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.5 });

    document.querySelectorAll('.skill-item').forEach(el => skillObserver.observe(el));

    // Back to top
    const backToTop = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 300) {
        backToTop.classList.add('visible');
      } else {
        backToTop.classList.remove('visible');
      }
    });

    backToTop.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Footer year
    document.getElementById('year').textContent = new Date().getFullYear();

    // Contact form → WhatsApp
    document.getElementById('contactForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const subject = document.getElementById('subject').value.trim();
      const message = document.getElementById('message').value.trim();

      const text = `*New Portfolio Message*\n\n*Name:* ${name}\n*Email:* ${email}\n*Subject:* ${subject}\n\n*Message:*\n${message}`;
      const phone = '254792289553';
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');

      const btn = e.target.querySelector('button[type="submit"]');
      const originalText = btn.textContent;
      btn.textContent = 'Opening WhatsApp...';
      setTimeout(() => {
        btn.textContent = originalText;
        e.target.reset();
      }, 2000);
    });

    // Smooth scroll for nav links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', (e) => {
        const href = anchor.getAttribute('href');
        if (href && href.startsWith('#') && href.length > 1) {
          e.preventDefault();
          const target = document.querySelector(href);
          if (target) {
            target.scrollIntoView({ behavior: 'smooth' });
          }
        }
      });
    });
  </script>

function openExcelViewer() {
  const viewer = document.getElementById('excel-viewer');
  const container = document.getElementById('excel-table-container');
  container.innerHTML = 'Reading workbook...';
  viewer.style.display = 'flex';
  try {
    const bytes = Uint8Array.from(atob(EXCEL_B64), c => c.charCodeAt(0));
    const workbook = XLSX.read(bytes, { type: 'array' });
    const sheetName = workbook.SheetNames[0];
    const worksheet = workbook.Sheets[sheetName];
    const html = XLSX.utils.sheet_to_html(worksheet, { raw: true });
    container.innerHTML = '<div class="excel-scroll">' + html + '</div>';
  } catch (e) {
    container.innerHTML = '<p style="color:var(--text-muted);">Could not read workbook: ' + (e.message || String(e)) + '</p>';
  }
}
function closeExcelViewer() {
  document.getElementById('excel-viewer').style.display = 'none';
}

          <button class="trade-quick-btn" onclick="tradeAction('buy')">Buy</button>
          <button class="trade-quick-btn" onclick="tradeAction('sell')">Sell</button>
          <button class="trade-quick-btn" onclick="depositFunds()">Deposit</button>
          <button class="trade-quick-btn" onclick="withdrawFunds()">Withdraw</button>
          <button class="trade-quick-btn" onclick="refreshPrices()">Refresh</button>
        </div>
      </div>
<div class="trade-main">
  <div class="trade-tab-panels">
    <!-- Home: Positions & Overview -->
    <div class="trade-tab-panel active" id="tab-home">
      <div class="trade-trading-panel">
        <div class="trade-panel-header">💼 Positions</div>
        <div class="trade-trading-content">
          <div class="trade-order-form">
            <div class="trade-order-title">Open Positions</div>
            <div id="tradePositions" style="padding:1rem;color:#94a3b8;text-align:center;">No open positions yet. Go to Futures to place your first trade.</div>
          </div>
        </div>
      </div>
    </div>
    <!-- Market: Watchlist + Chart -->
    <div class="trade-tab-panel" id="tab-market">
      <div class="trade-watchlist">
        <div class="trade-panel-header">📊 Market Watch</div>
        <div class="trade-watchlist-items" id="tradeWatchlist"></div>
      </div>
      <div class="trade-chart-area">
        <div class="trade-chart-controls" style="display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;background:#111827;border-bottom:1px solid #1e293b;">
          <div style="font-weight:700;color:#f8fafc;font-size:0.9rem;">EUR/USD — Live Chart</div>
          <div style="display:flex;gap:0.5rem;">
            <button class="trade-chart-btn" onclick="setTimeframe('1m')" style="padding:0.375rem 0.75rem;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#f8fafc;font-size:0.75rem;cursor:pointer;">1m</button>
            <button class="trade-chart-btn" onclick="setTimeframe('5m')" style="padding:0.375rem 0.75rem;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#f8fafc;font-size:0.75rem;cursor:pointer;">5m</button>
            <button class="trade-chart-btn" onclick="setTimeframe('15m')" style="padding:0.375rem 0.75rem;background:#334155;border:1px solid #3b82f6;border-radius:6px;color:#3b82f6;font-size:0.75rem;cursor:pointer;">15m</button>
            <button class="trade-chart-btn" onclick="setTimeframe('1h')" style="padding:0.375rem 0.75rem;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#f8fafc;font-size:0.75rem;cursor:pointer;">1h</button>
          </div>
        </div>
        <canvas id="tradeChartCanvas" style="width:100%;height:100%;display:block;background:#0b1026;"></canvas>
      </div>
    </div>
    <!-- Futures: Order Form -->
    <div class="trade-tab-panel" id="tab-futures">
      <div class="trade-trading-panel">
        <div class="trade-panel-header">💱 New Order</div>
        <div class="trade-trading-content">
          <div class="trade-order-form">
            <div class="trade-order-title">Place Order</div>
            <div class="trade-order-tabs">
              <button class="trade-order-tab buy active" onclick="setOrderType('buy')">BUY</button>
              <button class="trade-order-tab sell" onclick="setOrderType('sell')">SELL</button>
            </div>
            <div class="trade-form-group">
              <label class="trade-form-label">Symbol</label>
              <select class="trade-form-input" id="tradeSymbol">
                <option>EUR/USD</option>
                <option>GBP/USD</option>
                <option>XAU/USD</option>
                <option>BTC/USD</option>
                <option>AAPL</option>
                <option>TSLA</option>
              </select>
            </div>
            <div class="trade-form-group">
              <label class="trade-form-label">Order Type</label>
              <select class="trade-form-input" id="tradeOrderType">
                <option value="market">Market Order (Instant)</option>
                <option value="limit">Limit Order (Set Price)</option>
              </select>
            </div>
            <div class="trade-form-group">
              <label class="trade-form-label">Volume (lots)</label>
              <input class="trade-form-input" id="tradeVolume" type="number" value="0.1" min="0.01" step="0.01">
            </div>
            <div class="trade-form-group" id="tradePriceGroup">
              <label class="trade-form-label">Price</label>
              <input class="trade-form-input" id="tradePrice" type="number" step="0.00001" readonly placeholder="Current market price">
            </div>
            <div class="trade-form-group" id="tradeSLGroup">
              <label class="trade-form-label">Stop Loss (SL)</label>
              <input class="trade-form-input" id="tradeSL" type="number" step="0.00001" placeholder="Auto-calculated">
            </div>
            <div class="trade-form-group" id="tradeTPGroup">
              <label class="trade-form-label">Take Profit (TP)</label>
              <input class="trade-form-input" id="tradeTP" type="number" step="0.00001" placeholder="Auto-calculated">
            </div>
            <div class="trade-hint" style="font-size:0.75rem;color:#94a3b8;text-align:center;margin-top:0.5rem;">💡 Tip: Buy = price goes up, Sell = price goes down. Your profit/loss updates live.</div>
            <button class="trade-execute-btn" onclick="executeTrade()">Execute Trade</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Wallet: Deposit/Withdraw + History -->
    <div class="trade-tab-panel" id="tab-wallet">
      <div class="trade-deposit-withdraw">
        <div class="trade-dw-title">Deposit / Withdraw</div>
        <div class="trade-dw-row">
          <input class="trade-dw-input" id="dwAmount" type="number" placeholder="Amount ($)">
        </div>
        <div class="trade-dw-row">
          <button class="trade-dw-btn deposit" onclick="depositFunds()">Deposit</button>
          <button class="trade-dw-btn withdraw" onclick="withdrawFunds()">Withdraw</button>
        </div>
      </div>
      <div class="trade-history">
        <div class="trade-panel-header">📜 Trade History</div>
        <div class="trade-history-items" id="tradeHistory"></div>
      </div>
    </div>
  </div>
</div>
  <div class="trade-bottom-nav">
    <a class="trade-nav-item active" onclick="switchTab('home')" data-tab="home">🏠<span>Home</span></a>
    <a class="trade-nav-item" onclick="switchTab('market')" data-tab="market">📊<span>Market</span></a>
    <a class="trade-nav-item" onclick="switchTab('futures')" data-tab="futures">📈<span>Futures</span></a>
    <a class="trade-nav-item" onclick="switchTab('wallet')" data-tab="wallet">💰<span>Wallet</span></a>
  </div>
</div>

  </div>
  <div class="trade-notification" id="tradeNotify">
    <div class="trade-notify-title" id="tradeNotifyTitle">Trade Executed</div>
    <div class="trade-notify-body" id="tradeNotifyBody">Your order has been placed.</div>
  </div>
  <script>
    // Trading Platform Logic
    const symbols = ['EUR/USD', 'GBP/USD', 'XAU/USD', 'BTC/USD', 'AAPL', 'TSLA'];
    let balance = 10000.00;
    let positions = [];
    let history = [];
    let currentPrices = {};
    let chart = null;
    let candleData = [];
    let timeframe = '15m';
    let selectedSymbol = 'EUR/USD';

    // Trade mode: opened in a new tab via ?trade
    if (new URLSearchParams(window.location.search).has('trade')) {
      document.body.classList.add('trade-mode');
      document.getElementById('tradeModal').style.display = 'flex';
      initWatchlist();
      updateBalanceUI();
      startPriceTicker();
      initChart();
      // Close button returns to portfolio tab
      document.querySelector('.trade-close').onclick = () => window.close();
    }

    function openTrading() {
      window.open(window.location.pathname + '?trade', '_blank');
    }

    function closeTrading() {
      document.getElementById('tradeModal').style.display = 'none';
      stopPriceTicker();
    }

    function switchTab(tab) {
      document.querySelectorAll('.trade-tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.trade-nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      const navItem = document.querySelector('.trade-nav-item[data-tab="' + tab + '"]');
      if (navItem) navItem.classList.add('active');
      if (tab === 'market' && chart) {
        chart.resize();
      }
    }

    function initWatchlist() {
      const container = document.getElementById('tradeWatchlist');
      container.innerHTML = '';
      symbols.forEach(sym => {
        currentPrices[sym] = getRandomPrice(sym);
        const div = document.createElement('div');
        div.className = 'trade-watch-item';
        div.onclick = () => {
          selectedSymbol = sym;
          document.getElementById('tradeSymbol').value = sym;
          document.getElementById('tradePrice').value = currentPrices[sym].toFixed(5);
          document.getElementById('tradeSLGroup').style.display = 'none';
          document.getElementById('tradeTPGroup').style.display = 'none';
          loadChart(sym);
          // highlight watchlist item
          document.querySelectorAll('.trade-watch-item').forEach(el => el.style.background = '#0b1026');
          div.style.background = '#1e293b';
        };
        div.innerHTML = `
          <span class="trade-watch-symbol">${sym}</span>
          <div style="display:flex;align-items:center;gap:0.5rem;">
            <span class="trade-watch-price" id="price-${sym}">${currentPrices[sym].toFixed(5)}</span>
            <span class="trade-watch-change" id="change-${sym}">+0.00 (0.00%)</span>
          </div>
        `;
        container.appendChild(div);
      });
      // select first symbol by default
      document.querySelector('.trade-watch-item').style.background = '#1e293b';
      loadChart(symbols[0]);
    }

    function getRandomPrice(sym) {
      const base = { 'EUR/USD': 1.0850, 'GBP/USD': 1.2650, 'XAU/USD': 2650.00, 'BTC/USD': 67500.00, 'AAPL': 185.50, 'TSLA': 245.30 }[sym] || 1.0;
      return base * (0.995 + Math.random() * 0.01);
    }

    function generateCandles(sym, count = 100) {
      const base = { 'EUR/USD': 1.0850, 'GBP/USD': 1.2650, 'XAU/USD': 2650.00, 'BTC/USD': 67500.00, 'AAPL': 185.50, 'TSLA': 245.30 }[sym] || 1.0;
      const candles = [];
      let price = base;
      const now = Date.now();
      const intervalMs = timeframe === '1m' ? 60000 : timeframe === '5m' ? 300000 : timeframe === '15m' ? 900000 : 3600000;
      for (let i = count - 1; i >= 0; i--) {
        const open = price;
        const change = (Math.random() - 0.5) * 0.004 * price;
        const close = open + change;
        const high = Math.max(open, close) + Math.random() * 0.002 * price;
        const low = Math.min(open, close) - Math.random() * 0.002 * price;
        candles.push({
          x: now - i * intervalMs,
          o: open,
          h: high,
          l: low,
          c: close
        });
        price = close;
      }
      currentPrices[sym] = candles[candles.length - 1].c;
      return candles;
    }

    function initChart() {
      const canvas = document.getElementById('tradeChartCanvas');
      const ctx = canvas.getContext('2d');
      // Set explicit canvas size based on parent
      const resizeObserver = new ResizeObserver(() => {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        if (chart) {
          chart.resize();
        }
      });
      resizeObserver.observe(canvas.parentElement);

      chart = new Chart(ctx, {
        type: 'candlestick',
        data: {
          datasets: [{
            label: 'Price',
            data: [],
            borderColor: '#ef4444',
            downColor: '#ef4444',
            upColor: '#22c55e',
            borderWidth: 1
          }]
        },
        options: {
          animation: { duration: 0 },
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'nearest', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(17, 24, 39, 0.9)',
              titleColor: '#f8fafc',
              bodyColor: '#e2e8f0',
              borderColor: '#334155',
              borderWidth: 1,
              padding: 10,
              callbacks: {
                title: items => new Date(items[0].label).toLocaleString(),
                label: ctx => `O: ${ctx.raw.o.toFixed(5)} | H: ${ctx.raw.h.toFixed(5)} | L: ${ctx.raw.l.toFixed(5)} | C: ${ctx.raw.c.toFixed(5)}`
              }
            }
          },
          scales: {
            x: {
              type: 'time',
              time: { unit: timeframe === '1m' ? 'minute' : timeframe === '5m' ? 'minute' : timeframe === '15m' ? '15 minutes' : 'hour' },
              display: true,
              grid: { display: false },
              ticks: { color: '#94a3b8', font: { size: 10 } }
            },
            y: {
              grid: { color: '#1e293b' },
              ticks: { color: '#94a3b8', font: { size: 10 } }
            }
          }
        }
      });
    }

    function loadChart(sym) {
      selectedSymbol = sym;
      candleData = generateCandles(sym, 100);
      chart.data.datasets[0].data = candleData;
      chart.options.scales.x.time.unit = timeframe === '1m' ? 'minute' : timeframe === '5m' ? 'minute' : timeframe === '15m' ? '15 minutes' : 'hour';
      chart.update();
      document.getElementById('tradePrice').value = currentPrices[sym].toFixed(5);
    }

    function setTimeframe(tf) {
      timeframe = tf;
      document.querySelectorAll('.trade-chart-btn').forEach(btn => {
        btn.style.background = '#1e293b';
        btn.style.borderColor = '#334155';
        btn.style.color = '#f8fafc';
      });
      event.target.style.background = '#334155';
      event.target.style.borderColor = '#3b82f6';
      event.target.style.color = '#3b82f6';
      loadChart(selectedSymbol);
    }

    let tickerInterval;
    function startPriceTicker() {
      tickerInterval = setInterval(() => {
        symbols.forEach(sym => {
          currentPrices[sym] += (Math.random() - 0.5) * 0.002 * currentPrices[sym];
          const el = document.getElementById(`price-${sym}`);
          const changeEl = document.getElementById(`change-${sym}`);
          if (el) el.textContent = currentPrices[sym].toFixed(5);
          const change = ((Math.random() - 0.48) * 0.02).toFixed(2);
          const changeColor = change >= 0 ? '#22c55e' : '#ef4444';
          if (changeEl) {
            changeEl.textContent = `${change >= 0 ? '+' : ''}${change} (${change >= 0 ? '+' : ''}${change}%)`;
            changeEl.style.color = changeColor;
          }
        });
        // Add new candle every tick
        if (chart && candleData.length > 0) {
          const last = candleData[candleData.length - 1];
          const newClose = last.c + (Math.random() - 0.5) * 0.002 * last.c;
          const newCandle = {
            x: last.x + (timeframe === '1m' ? 60000 : timeframe === '5m' ? 300000 : timeframe === '15m' ? 900000 : 3600000),
            o: last.c,
            h: Math.max(last.c, newClose) + Math.random() * 0.001 * last.c,
            l: Math.min(last.c, newClose) - Math.random() * 0.001 * last.c,
            c: newClose
          };
          candleData.push(newCandle);
          candleData.shift();
          currentPrices[selectedSymbol] = newClose;
          chart.data.datasets[0].data = candleData;
          chart.update('none');
          document.getElementById(`price-${selectedSymbol}`).textContent = newClose.toFixed(5);
        }
        updatePositionsUI();
      }, 1500);
    }

    function stopPriceTicker() {
      if (tickerInterval) clearInterval(tickerInterval);
    }

    function refreshPrices() {
      symbols.forEach(sym => currentPrices[sym] = getRandomPrice(sym));
      initWatchlist();
      showNotify('Prices Refreshed', 'All market prices updated.');
    }

    function updateBalanceUI() {
      document.getElementById('tradeBalance').textContent = `$${balance.toFixed(2)}`;
      const pnl = positions.reduce((sum, p) => sum + p.pnl, 0);
      const pct = ((pnl / balance) * 100).toFixed(2);
      document.getElementById('tradeChange').textContent = `${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)} (${pnl >= 0 ? '+' : ''}${pct}%) ${pnl >= 0 ? '▲' : '▼'}`;
      document.getElementById('tradeChange').style.color = pnl >= 0 ? '#22c55e' : '#ef4444';
    }

    function updatePositionsUI() {
      positions.forEach(p => {
        const current = currentPrices[p.symbol] || p.price;
        const diff = p.type === 'buy' ? (current - p.price) : (p.price - current);
        p.pnl = diff * p.volume * 100;
      });
      updateBalanceUI();
    }

    function setOrderType(type) {
      document.querySelectorAll('.trade-order-tab').forEach(t => {
        t.classList.remove('active');
        t.style.background = '#1e293b';
        t.style.color = '#94a3b8';
      });
      const btn = document.querySelector(`.trade-order-tab.${type}`);
      btn.classList.add('active');
      btn.style.background = type === 'buy' ? '#15803d' : '#b91c1c';
      btn.style.color = '#ffffff';
    }

    function executeTrade() {
      const symbol = document.getElementById('tradeSymbol').value;
      const volume = parseFloat(document.getElementById('tradeVolume').value) || 0.01;
      const orderType = document.getElementById('tradeOrderType').value;
      const price = currentPrices[symbol] || parseFloat(document.getElementById('tradePrice').value) || 0;
      const sl = parseFloat(document.getElementById('tradeSL').value) || null;
      const tp = parseFloat(document.getElementById('tradeTP').value) || null;
      const type = document.querySelector('.trade-order-tab.active').classList.contains('buy') ? 'buy' : 'sell';
      const cost = volume * price * 100;

      if (type === 'buy' && cost > balance) {
        showNotify('Insufficient Funds', 'Account balance too low for this volume.');
        return;
      }

      const position = {
        id: Date.now(),
        symbol,
        type,
        volume,
        price,
        orderType,
        sl,
        tp,
        pnl: 0,
        time: new Date().toLocaleTimeString()
      };
      positions.push(position);

      if (type === 'buy') balance -= cost;
      else balance += cost * 0.5;

      history.unshift({ ...position, pnl: 0 });
      if (history.length > 50) history.pop();

      document.getElementById('tradePrice').value = price.toFixed(5);
      updateBalanceUI();
      renderHistory();
      showNotify('Order Executed', `${type.toUpperCase()} ${volume} lots ${symbol} at ${price.toFixed(5)}`);
    }

    function renderHistory() {
      const container = document.getElementById('tradeHistory');
      container.innerHTML = '';
      history.slice(0, 10).forEach(h => {
        const div = document.createElement('div');
        div.className = 'trade-history-item';
        div.innerHTML = `
          <span class="symbol">${h.symbol}</span><br>
          <span class="type-${h.type}">${h.type.toUpperCase()} ${h.orderType}</span>
          <span class="amount">${h.volume} lots @ ${h.price.toFixed(5)}</span><br>
          <span>${h.time}</span>
        `;
        container.appendChild(div);
      });
    }

    function depositFunds() {
      const input = document.getElementById('dwAmount');
      const amount = parseFloat(input.value) || 0;
      if (amount <= 0) { showNotify('Invalid Amount', 'Enter a positive amount.'); return; }
      balance += amount;
      input.value = '';
      updateBalanceUI();
      showNotify('Deposit Successful', `+$${amount.toFixed(2)} credited to account.`);
    }

    function withdrawFunds() {
      const input = document.getElementById('dwAmount');
      const amount = parseFloat(input.value) || 0;
      if (amount <= 0) { showNotify('Invalid Amount', 'Enter a positive amount.'); return; }
      if (amount > balance) { showNotify('Insufficient Funds', 'Cannot withdraw more than balance.'); return; }
      balance -= amount;
      input.value = '';
      updateBalanceUI();
      showNotify('Withdrawal Successful', `-$${amount.toFixed(2)} withdrawn from account.`);
    }

    function tradeAction(action) {
      document.getElementById('tradeSymbol').value = 'EUR/USD';
      document.getElementById('tradePrice').value = currentPrices['EUR/USD']?.toFixed(5) || '1.08500';
      setOrderType(action);
      showNotify('Action Selected', `Ready to ${action.toUpperCase()} EUR/USD.`);
    }

    function showNotify(title, body) {
      const n = document.getElementById('tradeNotify');
      document.getElementById('tradeNotifyTitle').textContent = title;
      document.getElementById('tradeNotifyBody').textContent = body;
      n.classList.add('show');
      setTimeout(() => n.classList.remove('show'), 3000);
    }

    // Expose openTrading globally
    window.openTrading = openTrading;
    window.closeTrading = closeTrading;
  </script>
